app = "youtubetotext"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  RESUMA_ENV = "production"
  RESUMA_TRUST_PROXY = "1"
  RESUMA_TRUSTED_PROXY_CIDRS = "fdaa::/16"
  RESUMA_ADDR = "0.0.0.0:8080"
  RESUMA_DATA_DIR = "/data"
  SITE_URL = "https://forgeyt.com"
  CARGO_MANIFEST_DIR = "/app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one warm machine so mobile FCP/LCP are not tanked by cold starts.
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options.response]
    # Stop advertising Fly’s Server / Via fingerprints (monitor.works finding).
    pristine = true

  [http_service.http_options.response.headers]
    X-Permitted-Cross-Domain-Policies = "none"

  [[http_service.checks]]
    grace_period = "20s"
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
