[package]
name = "youtubetotext"
version = "0.1.0"
edition = "2021"
description = "Free YouTube transcript — search, download SRT/VTT."

[dependencies]
resuma = "1.3.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "cookies"] }
axum = { version = "0.8", features = ["query", "json"] }
url = "2"
once_cell = "1"
parking_lot = "0.12"
html-escape = "0.2"
