[package]
name = "youtubetotext"
version = "0.1.0"
edition = "2021"
description = "YouTubeForge — transcripts, audio, SRT, translation, and summaries."

[dependencies]
resuma = { git = "https://github.com/GoldevLab/resuma.git", version = "1.3.1" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "cookies", "stream"] }
axum = { version = "0.8", features = ["query", "json"] }
url = "2"
once_cell = "1"
parking_lot = "0.12"
html-escape = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
