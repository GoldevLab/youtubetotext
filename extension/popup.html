<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTubeForge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>YouTubeForge</h1>
  <p>On a YouTube watch page, click <strong>Get transcript</strong> under the video, or use the button below.</p>
  <button type="button" id="run">Get transcript</button>
  <button type="button" id="home" class="ghost">Open YouTubeForge</button>
  <p class="note">Ads stay on the website, not in this popup. That is how Google AdSense allows it.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
